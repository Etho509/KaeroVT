<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#93cabc">
  <meta name="description" content="KaeroVT — physicist, stupid idiot, and EN VTuber. Find streams, socials, and the latest weekly schedule.">
  <title>KaeroVT — Links</title>
  <link rel="stylesheet" href="assets/links.css">
</head>
<body class="animated-page">
  <div class="page-shell">

    <main class="link-card">

      <header>
        <div class="name-frame">
          <h1>KaeroVT</h1>
        </div>
        <p class="bio">Physicist <span>•</span> Stupid Idiot <span>•</span> EN VTuber</p>
      </header>

      <section class="schedule" aria-label="Stream schedule">
        <p>Weekly stream schedule on Discord & X.</p>
      </section>

      <nav class="links" aria-label="KaeroVT social links">
        <a class="link twitch" href="https://twitch.tv/kaerovt" target="_blank" rel="noopener noreferrer">
          <img class="link-icon" src="assets/icons/twitch.svg" alt="" width="24" height="24">
          <span><strong>Twitch</strong><small>watch me live</small></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link tiktok" href="https://www.tiktok.com/@kaerovt" target="_blank" rel="noopener noreferrer">
          <img class="link-icon" src="assets/icons/tiktok.svg" alt="" width="24" height="24">
          <span><strong>TikTok</strong><small>little stream moments</small></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link twitter" href="https://www.x.com/kaerovt" target="_blank" rel="noopener noreferrer">
          <img class="link-icon" src="assets/icons/x.svg" alt="" width="24" height="24">
          <span><strong>Twitter / X</strong><small>updates & mostly nonsense</small></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link instagram" href="https://www.instagram.com/kaerovt/" target="_blank" rel="noopener noreferrer">
          <img class="link-icon" src="assets/icons/instagram.svg" alt="" width="24" height="24">
          <span><strong>Instagram</strong><small>find me @kaerovt</small></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>

      <section class="discord-panel" aria-labelledby="discord-title">
        <div class="discord-heading">
          <img class="link-icon" src="assets/icons/discord.svg" alt="" width="24" height="24">
          <div>
            <h2 id="discord-title">Discord</h2>
            <p>schedule, updates & community</p>
          </div>
        </div>
        <div class="widget-frame">
          <iframe
            src="https://discord.com/widget?id=1406693792362528909&amp;theme=dark"
            width="350"
            height="500"
            title="KaeroVT Discord server widget"
            loading="lazy"
            allowtransparency="true"
            frameborder="0"
            sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
          ></iframe>
        </div>
        <a class="discord-join" href="https://discord.gg/DSYdjDmwvd" target="_blank" rel="noopener noreferrer">Join the Discord <span aria-hidden="true">↗</span></a>
      </section>

      <footer>
        <p>thanks for stopping by <span aria-hidden="true">♡</span></p>
      </footer>
    </main>

  </div>
</body>
</html>
